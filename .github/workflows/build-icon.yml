name: Build Adaptive AppIcon (Assets.car)

on:
  workflow_dispatch:

jobs:
  build-icon:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compile AppIcon.icon with Xcode actool
        run: |
          xcodebuild -version
          mkdir -p out

          compile_with() {
            local xcode="$1"
            echo "Trying $xcode ..."
            sudo xcode-select -s "$xcode/Contents/Developer"
            rm -rf out/*
            xcrun actool --compile out \
              --output-format human-readable-text \
              --notices --warnings --errors \
              --output-partial-info-plist out/partial-Info.plist \
              --app-icon AppIcon \
              --include-all-app-icons \
              --enable-on-demand-resources NO \
              --development-region zh-Hans \
              --target-device mac \
              --minimum-deployment-target 14.0 \
              --platform macosx \
              Assets/AppIcon.icon
            [ -f out/Assets.car ]
          }

          SUCCESS=0
          for xcode in /Applications/Xcode.app /Applications/Xcode_26.6.app /Applications/Xcode_26.4.app /Applications/Xcode_26.2.app /Applications/Xcode_26.0.1.app; do
            [ -d "$xcode" ] || continue
            if compile_with "$xcode"; then
              SUCCESS=1
              break
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "actool failed to produce out/Assets.car on all Xcodes"
            exit 1
          fi

          ls -la out/
          cat out/partial-Info.plist || true

      - name: Upload compiled icon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-appicon
          path: |
            out/Assets.car
            out/AppIcon.icns
            out/partial-Info.plist
